# Local development stack: MongoDB, the FastAPI backend and the Next.js web app.
# All credentials are read from .env (see .env.example); none are written here.

name: chepagame

services:
  mongodb:
    image: mongo:8.0
    container_name: chepagame-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
    # A replica set is required for multi-document transactions. With auth enabled, replica set
    # members need a keyfile; it is generated inside the container on each start and never
    # touches the host or the repository.
    entrypoint: ["bash", "-c"]
    command:
      - |
        head -c 756 /dev/urandom | base64 > /etc/mongo-keyfile
        chmod 400 /etc/mongo-keyfile
        chown mongodb:mongodb /etc/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /etc/mongo-keyfile --bind_ip_all
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    # Initiates the single-node replica set on first run, then reports its status.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin --eval
          "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  backend:
    build: ./backend
    container_name: chepagame-backend
    env_file: .env
    environment:
      # Inside the compose network MongoDB is reachable as "mongodb", not localhost: the backend
      # swaps the host of MONGODB_URI (credentials stay URL-encoded as written in .env).
      MONGODB_HOST_OVERRIDE: mongodb:27017
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      mongodb:
        condition: service_healthy

  web:
    build: ./web
    container_name: chepagame-web
    env_file: .env
    environment:
      API_INTERNAL_BASE_URL: http://backend:8000/api/v1
      AUTH_TRUST_HOST: "true"
      # Principle VI: no data to third parties without opt-in.
      NEXT_TELEMETRY_DISABLED: "1"
      # Bind mounts from Windows/macOS hosts do not emit file events: poll for hot reload.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./web:/app
      # Keep the container's own dependencies and build output, not the host's.
      - /app/node_modules
      - /app/.next
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
  mongodb_config:
