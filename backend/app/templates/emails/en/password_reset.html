{% extends "en/base.html" %}
{% set subject = "Your code to change your password" %}
{% block content %}
<p>Hi,</p><p>Use this code to set a new password:</p><p style="font-size:28px;font-weight:bold;letter-spacing:6px;margin:24px 0;">{{ code }}</p><p>It expires in {{ expiresInMinutes }} minutes. If you did not request it, ignore this email: your password stays the same.</p>
{% endblock %}
