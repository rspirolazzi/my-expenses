<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f5f7fa;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
      <tr>
        <td style="padding:24px 32px;border-bottom:1px solid #e4e7eb;font-size:20px;font-weight:bold;">Mis Gastos</td>
      </tr>
      <tr>
        <td style="padding:24px 32px;font-size:15px;line-height:1.5;">
          {% block content %}{% endblock %}
        </td>
      </tr>
      <tr>
        <td style="padding:16px 32px;border-top:1px solid #e4e7eb;font-size:12px;color:#7b8794;">You received this email because of your Mis Gastos account. We will never ask for your password.</td>
      </tr>
    </table>
  </body>
</html>
